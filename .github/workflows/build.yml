# hc-cadconv — compile check on every push, packages on demand.
#
# This repository is PUBLIC, so standard GitHub-hosted runners cost nothing on
# any OS. That is the whole reason the converter lives here: in the private tree
# a cold macOS build would have eaten a third of the free monthly allowance, and
# so the mac binary kept being deferred.
#
# Two jobs, deliberately split:
#
#   check    — Linux only, on every push. OCCT is cached, so this is minutes and
#              it answers the one question a C++ edit raises: does it build, and
#              does the binary still write every block? The canonical tree lives
#              in a private repo whose author has no local toolchain, so without
#              this a mistake waits for a package run to surface.
#   package  — all three platforms, manual. Produces the artifacts a release is
#              cut from: the Windows installer, and the bare onedir folder for
#              macOS and Linux.
#
# NB the OCCT cache is evicted after 7 idle days, and a cold build is well over
# an hour. Do not add a schedule to keep it warm — that burns the runner budget
# to save the runner budget. Build when the source changes; accept a cold run.
#
# The cache is RESTORED and SAVED as separate steps on purpose. `actions/cache`
# writes nothing when the job fails, so the first red smoke would have made every
# retry pay for a full cold OCCT build again — an hour per iteration to fix a
# one-line linker flag. OCCT's validity does not depend on our tests, so it is
# saved the moment it finishes building.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: compile check (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: ninja + patchelf
        run: sudo apt-get update && sudo apt-get install -y ninja-build patchelf
      - name: restore OCCT
        id: occt_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            _occt/linux-64
            _occt/occt-src/LICENSE_LGPL_21.txt
            _occt/occt-src/OCCT_LGPL_EXCEPTION.txt
            _occt/rapidjson/license.txt
          key: occt-V7_9_3-linux-64-v3
      - name: build OCCT
        if: steps.occt_cache.outputs.cache-hit != 'true'
        run: python build.py --occt
      - name: verify the OCCT prefix
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          pre = os.path.join("_occt", "linux-64")
          if not os.path.isdir(pre):
              sys.exit("no OCCT prefix at %s — the cache path must match "
                       "build.py's subdir()" % pre)
          n = sum(len(f) for _, _, f in os.walk(pre))
          print("OCCT prefix %s: %d files" % (pre, n))
          if n < 20:
              sys.exit("OCCT prefix holds %d files — saving that would cache "
                       "nothing and every run would rebuild from source" % n)
          PY
      - name: save OCCT
        if: steps.occt_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            _occt/linux-64
            _occt/occt-src/LICENSE_LGPL_21.txt
            _occt/occt-src/OCCT_LGPL_EXCEPTION.txt
            _occt/rapidjson/license.txt
          key: occt-V7_9_3-linux-64-v3
      - name: build converter
        run: python build.py --bundle
      - name: smoke
        run: python ci/smoke.py dist/hc-cadconv/hc-cadconv ci/smoke.stp

  package:
    name: package (${{ matrix.triple }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          # `triple` names the ASSET; `prefix` must equal build.py's subdir(),
          # which is what the OCCT install tree is actually called. They differ
          # on mac (osx-arm64 vs a friendlier macos-arm64) and a mismatch is
          # SILENT: the cache path does not exist, an EMPTY entry is saved, and
          # every run rebuilds OCCT from source while reporting a cache hit next
          # door. That cost 24 minutes a run until the 0 MB entry gave it away.
          - os: windows-latest
            triple: win-64
            prefix: win-64
            exe: dist/hc-cadconv/hc-cadconv.exe
          - os: macos-latest
            triple: macos-arm64
            prefix: osx-arm64
            exe: dist/hc-cadconv/hc-cadconv
          - os: ubuntu-latest
            triple: linux-64
            prefix: linux-64
            exe: dist/hc-cadconv/hc-cadconv
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: ninja + patchelf (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build patchelf
      - name: ninja (macos)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: restore OCCT
        id: occt_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            _occt/${{ matrix.prefix }}
            _occt/occt-src/LICENSE_LGPL_21.txt
            _occt/occt-src/OCCT_LGPL_EXCEPTION.txt
            _occt/rapidjson/license.txt
          key: occt-V7_9_3-${{ matrix.prefix }}-v3
      - name: build OCCT
        if: steps.occt_cache.outputs.cache-hit != 'true'
        run: python build.py --occt
      - name: verify the OCCT prefix
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          pre = os.path.join("_occt", "${{ matrix.prefix }}")
          if not os.path.isdir(pre):
              sys.exit("no OCCT prefix at %s — the cache path must match "
                       "build.py's subdir()" % pre)
          n = sum(len(f) for _, _, f in os.walk(pre))
          print("OCCT prefix %s: %d files" % (pre, n))
          if n < 20:
              sys.exit("OCCT prefix holds %d files — saving that would cache "
                       "nothing and every run would rebuild from source" % n)
          PY
      - name: save OCCT
        if: steps.occt_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            _occt/${{ matrix.prefix }}
            _occt/occt-src/LICENSE_LGPL_21.txt
            _occt/occt-src/OCCT_LGPL_EXCEPTION.txt
            _occt/rapidjson/license.txt
          key: occt-V7_9_3-${{ matrix.prefix }}-v3

      - name: build + bundle
        run: python build.py --bundle

      - name: smoke
        run: python ci/smoke.py ${{ matrix.exe }} ci/smoke.stp

      # Inno Setup 6 ships on the windows-latest image; choco is the fallback.
      - name: installer (windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc hardcraft-cadtools.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          $exe = Get-ChildItem dist\hardcraft-cadtools-*-win64.exe | Select-Object -First 1
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash
          "$sha  $($exe.Name)" | Tee-Object -FilePath "$($exe.FullName).sha256"
          "### $($exe.Name)`n`nSHA-256: ``$sha``  ($([math]::Round($exe.Length/1MB,1)) MB)" >> $env:GITHUB_STEP_SUMMARY

      # mac/linux ship a FOLDER, and a folder cannot be attached to a release.
      # tar.gz rather than zip: it keeps the executable bit and the symlinks the
      # OCCT dylibs use, both of which a zip round-trip quietly drops — the
      # download would then need a chmod before it runs at all.
      - name: archive (mac/linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          tar -C dist -czf "dist/hc-cadconv-${{ matrix.triple }}.tar.gz" hc-cadconv
          # from INSIDE dist: shasum records the path it was given, and a
          # `shasum -c` next to the download must not look for `dist/...`
          cd dist && shasum -a 256 "hc-cadconv-${{ matrix.triple }}.tar.gz" \
            | tee "hc-cadconv-${{ matrix.triple }}.tar.gz.sha256"

      # The manifest a consumer's release step reads INSTEAD of running the exe:
      # a release can be cut from any machine, and a Windows installer cannot be
      # interrogated from a mac. Without it the previously attached converter
      # gets dragged forward unchecked — which is exactly how a protocol-1
      # package stayed attached across a protocol bump and refused every tester.
      - name: manifest
        shell: bash
        run: |
          set -e
          python - "${{ matrix.exe }}" "${{ matrix.triple }}" <<'PY'
          import hashlib, json, os, subprocess, sys
          exe, triple = sys.argv[1], sys.argv[2]
          hs = json.loads(subprocess.run([exe, "--protocol"], capture_output=True,
                                         text=True).stdout.strip().splitlines()[-1])
          orc = json.load(open("smoke_out.glb.oracle.json", encoding="utf-8"))
          ANALYTIC = {"plane", "cylinder", "cone", "sphere", "torus"}
          an = [f for f in orc["faces"] if f["s"] in ANALYTIC]
          man = {"triple": triple, "protocol": hs["protocol"], "impl": hs["impl"],
                 "occt": hs["occt"], "commit": os.environ.get("GITHUB_SHA", ""),
                 "run": os.environ.get("GITHUB_RUN_ID", ""),
                 "has_placement": bool(an) and all(f.get("g") for f in an)}
          for name in sorted(os.listdir("dist")):
              p = os.path.join("dist", name)
              if os.path.isfile(p) and (name.endswith(".exe")
                                        or name.endswith(".tar.gz")):
                  man["asset"] = name
                  man["sha256"] = hashlib.sha256(open(p, "rb").read()).hexdigest()
          open("dist/hc-cadconv-%s.manifest.json" % triple, "w",
               encoding="utf-8").write(json.dumps(man, indent=2, sort_keys=True))
          print(json.dumps(man, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hc-cadconv-${{ matrix.triple }}
          path: |
            dist/hc-cadconv/
            dist/hardcraft-cadtools-*-win64.exe
            dist/hardcraft-cadtools-*-win64.exe.sha256
            dist/hc-cadconv-*.tar.gz
            dist/hc-cadconv-*.tar.gz.sha256
            dist/hc-cadconv-*.manifest.json
          if-no-files-found: error
